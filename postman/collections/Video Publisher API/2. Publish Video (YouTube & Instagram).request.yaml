$kind: http-request
description: Publishes a video to YouTube Shorts and Instagram Reels.
url: "{{base_url}}/api/publish"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: video
      src: []
      description: Local MP4 video file to transcode and upload
    - type: text
      key: videoUrl
      value: https://example.com/sample-video.mp4
      description: Publicly accessible URL required by Instagram Graph API
    - type: text
      key: title
      value: My First Short
      description: Title for YouTube Short
    - type: text
      key: caption
      value: "Check out this short video! #shorts #reels"
      description: Caption for Instagram Reel
    - type: text
      key: description
      value: Uploaded via Video Publisher API
      description: Description for YouTube Short
    - type: text
      key: privacyStatus
      value: private
      description: YouTube video privacy setting (private, unlisted, public)
order: 2000
