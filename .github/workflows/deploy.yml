name: Deploy Node.js App to Azure

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev --prefer-offline --no-audit --no-fund

      - name: Run automated test suite
        run: npm test
        env:
          NODE_ENV: test
          GOOGLE_CLIENT_ID: test_google_client_id
          INSTAGRAM_CLIENT_ID: test_instagram_client_id

      - name: Build slim deploy package (skip node_modules, tests, git)
        run: |
          zip -r release.zip server.js lib public package.json package-lock.json
          # Let Oryx reinstall on Azure from package-lock instead of uploading 100MB+ node_modules (ffmpeg-static binary)

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
