<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Publisher — Shorts & Reels</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-zinc-200 antialiased selection:bg-zinc-200 selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // Use current origin if served directly from Express, fallback to http://localhost:3000
    const API = window.location.origin.includes('http') ? window.location.origin : 'http://localhost:3000';

    function App() {
      // ---- state ----
      const [auth, setAuth] = useState({ youtubeConnected: false, instagramConnected: false });
      const [authLoading, setAuthLoading] = useState(true);
      const [file, setFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [duration, setDuration] = useState(null);
      const [dragActive, setDragActive] = useState(false);
      const [form, setForm] = useState({ title: '', caption: '', description: '', videoUrl: '' });
      const [privacy, setPrivacy] = useState('private');
      const [publishing, setPublishing] = useState(false);
      const [progress, setProgress] = useState(0);
      const [result, setResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState(null);
      const fileInputRef = useRef(null);

      // ---- auth status ----
      const fetchAuthStatus = useCallback(async () => {
        setAuthLoading(true);
        try {
          const res = await fetch(`${API}/api/auth-status`, { credentials: 'include' });
          if (res.ok) setAuth(await res.json());
        } catch {
          /* backend offline — keep badges in disconnected state */
        } finally {
          setAuthLoading(false);
        }
      }, []);

      useEffect(() => { fetchAuthStatus(); }, [fetchAuthStatus]);

      // ---- file handling ----
      const acceptFile = (f) => {
        if (!f) return;
        const isMp4 = f.type === 'video/mp4' || /\.mp4$/i.test(f.name);
        if (!isMp4) { setErrorMsg('Only MP4 files are accepted.'); return; }
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        setFile(f);
        setPreviewUrl(URL.createObjectURL(f));
        setDuration(null);
        setErrorMsg(null);
      };

      const onDrop = (e) => {
        e.preventDefault();
        setDragActive(false);
        acceptFile(e.dataTransfer.files?.[0]);
      };

      const clearFile = () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        setFile(null);
        setPreviewUrl(null);
        setDuration(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      useEffect(() => () => { if (previewUrl) URL.revokeObjectURL(previewUrl); }, [previewUrl]);

      const setField = (k) => (e) => setForm((p) => ({ ...p, [k]: e.target.value }));

      // ---- publish (XHR for upload progress) ----
      const publish = () => {
        if (!file) { setErrorMsg('Please choose an MP4 file first.'); return; }
        if (duration != null && duration > 900) {
          setErrorMsg('Video exceeds 15 minutes (900s), the maximum limit for Instagram Reels.');
          return;
        }
        setPublishing(true);
        setProgress(0);
        setResult(null);
        setErrorMsg(null);

        const fd = new FormData();
        fd.append('video', file);
        fd.append('title', form.title);
        fd.append('caption', form.caption);
        fd.append('description', form.description);
        fd.append('videoUrl', form.videoUrl);
        fd.append('privacyStatus', privacy);
        if (duration != null) fd.append('duration', String(Math.round(duration)));

        const xhr = new XMLHttpRequest();
        xhr.open('POST', `${API}/api/publish`);
        xhr.withCredentials = true;

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) setProgress(Math.round((e.loaded / e.total) * 90));
        };
        xhr.onload = () => {
          setProgress(100);
          setPublishing(false);
          try {
            const data = JSON.parse(xhr.responseText);
            if (xhr.status >= 200 && xhr.status < 300) setResult(data);
            else setErrorMsg(data.error || `Publish failed (${xhr.status})`);
          } catch {
            setErrorMsg(`Unexpected response (${xhr.status})`);
          }
        };
        xhr.onerror = () => {
          setPublishing(false);
          setErrorMsg('Network error — is the backend running on :3000?');
        };
        xhr.send(fd);
      };

      const connectedCount = (auth.youtubeConnected ? 1 : 0) + (auth.instagramConnected ? 1 : 0);

      return (
        <div className="min-h-screen bg-black text-zinc-200 antialiased selection:bg-zinc-200 selection:text-black"
             style={{ fontFamily: "'Inter', ui-sans-serif, system-ui, sans-serif" }}>

          {/* ambient glows */}
          <div className="pointer-events-none fixed inset-0 overflow-hidden">
            <div className="absolute -top-40 left-1/2 h-[500px] w-[800px] -translate-x-1/2 rounded-full bg-white/[0.04] blur-[120px]" />
            <div className="absolute right-[-200px] top-1/3 h-[420px] w-[420px] rounded-full bg-white/[0.03] blur-[100px]" />
          </div>

          <div className="relative mx-auto max-w-6xl px-6 pb-24">

            {/* ============ NAV ============ */}
            <header className="mt-6 flex items-center justify-between rounded-full border border-white/10 bg-white/[0.02] py-3 pl-6 pr-3 backdrop-blur">
              <div className="flex items-center gap-3">
                <LogoMark />
                <span className="text-sm font-medium tracking-wide text-zinc-100">Video Publisher</span>
              </div>

              <div className="hidden items-center gap-6 md:flex">
                <StatusBadge label="YouTube" connected={auth.youtubeConnected} loading={authLoading} />
                <StatusBadge label="Instagram" connected={auth.instagramConnected} loading={authLoading} />
              </div>

              <div className="flex items-center gap-2">
                {!auth.youtubeConnected && (
                  <a href={`${API}/auth/youtube`}
                     className="inline-flex items-center gap-2 rounded-full border border-white/15 px-4 py-2 text-xs font-medium text-zinc-300 transition hover:border-red-500/40 hover:bg-red-500/[0.06] hover:text-white">
                    <span className="text-red-500"><YtIcon /></span>
                    Connect YouTube
                  </a>
                )}
                {!auth.instagramConnected && (
                  <a href={`${API}/auth/instagram`}
                     className="inline-flex items-center gap-2 rounded-full border border-white/15 px-4 py-2 text-xs font-medium text-zinc-300 transition hover:border-pink-500/40 hover:bg-pink-500/[0.06] hover:text-white">
                    <span className="text-pink-400"><IgIcon /></span>
                    Connect Instagram
                  </a>
                )}
                <span className="rounded-full bg-zinc-100 px-4 py-2 text-xs font-semibold text-black shadow-[0_0_0_1px_rgba(255,255,255,0.2),0_8px_24px_rgba(255,255,255,0.08)]">
                  {connectedCount}/2 linked
                </span>
              </div>
            </header>

            {/* ============ HERO ============ */}
            <section className="mt-20 mb-14 max-w-2xl">
              <p className="mb-4 text-[11px] font-medium uppercase tracking-[0.25em] text-zinc-500">
                Shorts · Reels · One click
              </p>
              <h1 className="text-5xl font-light leading-[1.08] tracking-tight text-zinc-100 md:text-6xl">
                The only sane way to<br />
                <span className="text-zinc-400">publish vertical video</span>
              </h1>
              <p className="mt-6 max-w-md text-sm leading-relaxed text-zinc-500">
                Drop an MP4, we center-crop to 1080×1920 and fan it out to YouTube
                Shorts and Instagram Reels — with resumable uploads and zero files
                left behind.
              </p>
            </section>

            {/* ============ MAIN GRID ============ */}
            <main className="grid gap-6 lg:grid-cols-5">

              {/* ---- upload card ---- */}
              <div className="lg:col-span-3">
                <Card>
                  <CardHeader step="01" title="Source video" hint="MP4 · up to 500 MB" />

                  {!file ? (
                    <div
                      onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                      onDragLeave={() => setDragActive(false)}
                      onDrop={onDrop}
                      onClick={() => fileInputRef.current?.click()}
                      className={`group flex cursor-pointer flex-col items-center justify-center rounded-2xl border border-dashed px-6 py-16 text-center transition-all duration-300 ${
                        dragActive
                          ? 'border-zinc-300 bg-white/[0.06] scale-[1.01]'
                          : 'border-white/15 bg-white/[0.02] hover:border-white/30 hover:bg-white/[0.04]'
                      }`}
                    >
                      <div className="mb-5 flex h-14 w-14 items-center justify-center rounded-full border border-white/10 bg-black transition group-hover:border-white/25">
                        <UploadIcon />
                      </div>
                      <p className="text-sm font-medium text-zinc-200">
                        {dragActive ? 'Release to drop' : 'Drag & drop your MP4 here'}
                      </p>
                      <p className="mt-1 text-xs text-zinc-500">or click to browse your files</p>
                      <input ref={fileInputRef} type="file" accept="video/mp4,.mp4" className="hidden"
                             onChange={(e) => acceptFile(e.target.files?.[0])} />
                    </div>
                  ) : (
                    <>
                    <div className="overflow-hidden rounded-2xl border border-white/10 bg-black">
                      <div className="relative mx-auto max-h-[380px] w-full bg-black">
                        <video src={previewUrl} controls
                               onLoadedMetadata={(e) => setDuration(e.currentTarget.duration)}
                               className="mx-auto max-h-[380px] w-auto max-w-full" />
                      </div>
                      <div className="flex items-center justify-between border-t border-white/10 px-4 py-3">
                        <div className="min-w-0">
                          <p className="truncate text-sm font-medium text-zinc-200">{file.name}</p>
                          <p className="text-xs text-zinc-500">
                            {formatBytes(file.size)}{duration != null ? ` · ${formatDuration(duration)}` : ''}
                          </p>
                        </div>
                        <button onClick={clearFile}
                                className="ml-4 shrink-0 rounded-full border border-white/15 px-3 py-1.5 text-xs text-zinc-400 transition hover:border-white/30 hover:text-white">
                          Replace
                        </button>
                      </div>
                    </div>

                    {duration > 900 && (
                      <div className="mt-4 rounded-2xl border border-red-500/20 bg-red-500/[0.06] px-4 py-3 text-xs leading-relaxed text-red-300">
                        ❌ Error: Video exceeds 15 minutes (900s), which is the maximum limit for Instagram Reels.
                      </div>
                    )}
                    {duration > 180 && duration <= 900 && (
                      <div className="mt-4 rounded-2xl border border-amber-500/20 bg-amber-500/[0.06] px-4 py-3 text-xs leading-relaxed text-amber-300">
                        ⚠️ Note: Video exceeds 180 seconds (3 mins). It will be published as a standard YouTube video instead of a YouTube Short.
                      </div>
                    )}
                  </>
                )}
                </Card>

                {/* ---- publish card ---- */}
                <Card className="mt-6">
                  <CardHeader step="03" title="Publish" hint="YouTube + Instagram in parallel" />

                  {publishing && (
                    <div className="mb-5">
                      <div className="mb-2 flex items-center justify-between text-xs">
                        <span className="flex items-center gap-2 text-zinc-400">
                          <Spinner /> Transcoding & uploading…
                        </span>
                        <span className="tabular-nums text-zinc-300">{progress}%</span>
                      </div>
                      <div className="h-1.5 overflow-hidden rounded-full bg-white/[0.06]">
                        <div className="h-full rounded-full bg-gradient-to-r from-zinc-500 to-zinc-100 transition-all duration-300"
                             style={{ width: `${progress}%` }} />
                      </div>
                    </div>
                  )}

                  {errorMsg && (
                    <div className="mb-5 rounded-xl border border-red-500/20 bg-red-500/[0.06] px-4 py-3 text-xs text-red-300">
                      {errorMsg}
                    </div>
                  )}

                  <div className="flex flex-wrap items-center gap-3">
                    <button onClick={publish} disabled={publishing || !file || (duration != null && duration > 900)}
                            className="rounded-full bg-zinc-100 px-7 py-3 text-sm font-semibold text-black shadow-[0_0_0_1px_rgba(255,255,255,0.25),0_10px_30px_rgba(255,255,255,0.1)] transition hover:bg-white disabled:cursor-not-allowed disabled:opacity-30 disabled:shadow-none">
                      {publishing ? 'Publishing…' : 'Publish everywhere'}
                    </button>
                    <button onClick={() => { setForm({ title: '', caption: '', description: '', videoUrl: '' }); clearFile(); setResult(null); setErrorMsg(null); }}
                            disabled={publishing}
                            className="rounded-full border border-white/15 px-6 py-3 text-sm text-zinc-400 transition hover:border-white/30 hover:text-white disabled:opacity-40">
                      Reset
                    </button>
                    {!file && !publishing && (
                      <span className="text-xs text-zinc-600">Select a video to enable publishing</span>
                    )}
                    {file && duration != null && duration > 900 && !publishing && (
                      <span className="text-xs text-red-300">Video exceeds the 15-minute Reels limit</span>
                    )}
                  </div>
                </Card>
              </div>

              {/* ---- metadata card ---- */}
              <div className="lg:col-span-2">
                <Card className="h-full">
                  <CardHeader step="02" title="Metadata" hint="Applied to both platforms" />
                  <div className="space-y-5">
                    <Field label="Title">
                      <input value={form.title} onChange={setField('title')} placeholder="My awesome short"
                             className={inputCls} />
                    </Field>
                    <Field label="Caption" hint="Instagram">
                      <textarea value={form.caption} onChange={setField('caption')} rows={2}
                                placeholder="Caption for your Reel…" className={`${inputCls} resize-none`} />
                    </Field>
                    <Field label="Description" hint="YouTube">
                      <textarea value={form.description} onChange={setField('description')} rows={3}
                                placeholder="Description for your Short…" className={`${inputCls} resize-none`} />
                    </Field>
                    <Field label="Public video URL" hint="Required by the Graph API for Reels">
                      <input value={form.videoUrl} onChange={setField('videoUrl')} type="url"
                             placeholder="https://cdn.example.com/video.mp4" className={inputCls} />
                    </Field>
                    <Field label="Privacy" hint="YouTube">
                      <div className="grid grid-cols-3 gap-2">
                        {['private', 'unlisted', 'public'].map((p) => (
                          <button key={p} type="button" onClick={() => setPrivacy(p)}
                                  className={`rounded-full border px-3 py-2 text-xs font-medium capitalize transition ${
                                    privacy === p
                                      ? 'border-zinc-200 bg-zinc-100 text-black'
                                      : 'border-white/15 text-zinc-400 hover:border-white/30 hover:text-white'
                                  }`}>
                            {p}
                          </button>
                        ))}
                      </div>
                    </Field>
                  </div>
                </Card>
              </div>
            </main>

            {/* ============ FOOTER ============ */}
            <footer className="mt-16 flex items-center justify-between border-t border-white/[0.06] pt-6 text-[11px] text-zinc-600">
              <span>Files are transcoded to 9:16 and unlinked after publish</span>
              <span className="font-mono">api · localhost:3000</span>
            </footer>
          </div>

          {/* ============ RESULT MODAL ============ */}
          {result && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-6 backdrop-blur-sm"
                 onClick={() => setResult(null)}>
              <div className="w-full max-w-md rounded-3xl border border-white/10 bg-[#0a0a0a] p-7 shadow-2xl"
                   onClick={(e) => e.stopPropagation()}>
                <div className="mb-6 flex items-center justify-between">
                  <h3 className="text-lg font-medium text-zinc-100">Publish results</h3>
                  <button onClick={() => setResult(null)}
                          className="flex h-8 w-8 items-center justify-center rounded-full border border-white/15 text-zinc-400 transition hover:border-white/30 hover:text-white">
                    ✕
                  </button>
                </div>

                <div className="space-y-3">
                  {/* YouTube */}
                  <div className="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                    <div className="mb-2 flex items-center gap-2">
                      <span className="text-red-400"><YtIcon /></span>
                      <span className="text-xs font-medium uppercase tracking-wider text-zinc-400">YouTube Shorts</span>
                    </div>
                    {result.youtube?.videoId ? (
                      <>
                        <p className="mb-2 font-mono text-sm text-zinc-200">{result.youtube.videoId}</p>
                        <a href={`https://www.youtube.com/watch?v=${result.youtube.videoId}`}
                           target="_blank" rel="noreferrer"
                           className="inline-flex items-center gap-1.5 text-xs font-medium text-zinc-300 underline decoration-zinc-600 underline-offset-4 transition hover:text-white hover:decoration-zinc-300">
                          Watch on YouTube ↗
                        </a>
                      </>
                    ) : (
                      <p className="text-xs text-red-300">{result.youtube?.error || 'Failed'}</p>
                    )}
                  </div>

                  {/* Instagram */}
                  <div className="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                    <div className="mb-2 flex items-center gap-2">
                      <span className="text-pink-400"><IgIcon /></span>
                      <span className="text-xs font-medium uppercase tracking-wider text-zinc-400">Instagram Reels</span>
                    </div>
                    {result.instagram?.mediaId ? (
                      <p className="font-mono text-sm text-zinc-200">{result.instagram.mediaId}</p>
                    ) : (
                      <p className="text-xs text-red-300">{result.instagram?.error || 'Failed'}</p>
                    )}
                  </div>
                </div>

                <button onClick={() => setResult(null)}
                        className="mt-6 w-full rounded-full bg-zinc-100 py-3 text-sm font-semibold text-black transition hover:bg-white">
                  Done
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ================= atoms ================= */

    const inputCls =
      'w-full rounded-xl border border-white/10 bg-white/[0.03] px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition focus:border-white/30 focus:bg-white/[0.05]';

    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-3xl border border-white/10 bg-white/[0.02] p-6 backdrop-blur ${className}`}>
          {children}
        </div>
      );
    }

    function CardHeader({ step, title, hint }) {
      return (
        <div className="mb-5 flex items-baseline justify-between">
          <div className="flex items-baseline gap-3">
            <span className="font-mono text-[10px] tracking-widest text-zinc-600">{step}</span>
            <h2 className="text-sm font-semibold text-zinc-100">{title}</h2>
          </div>
          {hint && <span className="text-[11px] text-zinc-600">{hint}</span>}
        </div>
      );
    }

    function Field({ label, hint, children }) {
      return (
        <label className="block">
          <span className="mb-1.5 flex items-baseline justify-between">
            <span className="text-xs font-medium text-zinc-300">{label}</span>
            {hint && <span className="text-[10px] text-zinc-600">{hint}</span>}
          </span>
          {children}
        </label>
      );
    }

    function StatusBadge({ label, connected, loading }) {
      return (
        <span className="flex items-center gap-2 text-xs text-zinc-400">
          <span className={`h-1.5 w-1.5 rounded-full ${
            loading ? 'animate-pulse bg-zinc-500' : connected ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]' : 'bg-zinc-700'
          }`} />
          {label}
          <span className={connected ? 'text-emerald-400' : 'text-zinc-600'}>
            {loading ? '…' : connected ? 'linked' : 'offline'}
          </span>
        </span>
      );
    }

    function Spinner() {
      return (
        <svg className="h-3.5 w-3.5 animate-spin text-zinc-300" viewBox="0 0 24 24" fill="none">
          <circle className="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" />
          <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
        </svg>
      );
    }

    function LogoMark() {
      return (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" className="text-zinc-100">
          <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.5" />
          <path d="M15.5 8.5 8.5 15.5M8.5 8.5h7v7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    }

    function UploadIcon() {
      return (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" className="text-zinc-300">
          <path d="M12 16V4m0 0-4 4m4-4 4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
          <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
        </svg>
      );
    }

    function YtIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23 12s0-3.85-.46-5.58a2.9 2.9 0 0 0-2-2C18.88 4 12 4 12 4s-6.88 0-8.54.42a2.9 2.9 0 0 0-2 2C1 8.15 1 12 1 12s0 3.85.46 5.58a2.9 2.9 0 0 0 2 2c1.66.42 8.54.42 8.54.42s6.88 0 8.54-.42a2.9 2.9 0 0 0 2-2C23 15.85 23 12 23 12ZM9.75 15.5v-7L15.5 12l-5.75 3.5Z" />
        </svg>
      );
    }

    function IgIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none" />
        </svg>
      );
    }

    function formatBytes(n) {
      if (!n && n !== 0) return '';
      const u = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(i ? 1 : 0)} ${u[i]}`;
    }

    function formatDuration(secs) {
      if (secs == null || !isFinite(secs) || secs < 0) return '';
      const total = Math.round(secs);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
